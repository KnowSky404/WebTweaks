name: Bug report
description: Report a problem with an existing WebTweaks userscript
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: website
    attributes:
      label: Website
      description: Which website is affected?
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: script
    attributes:
      label: Affected script
      description: Give the script path or name.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 140
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: Userscript manager
      placeholder: Tampermonkey 5.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Console errors or screenshots
      description: Remove private information before sharing.
